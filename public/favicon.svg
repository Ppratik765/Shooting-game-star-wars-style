<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="neonBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" /> <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="neonOrange" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(0, 243, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)" />

  <g stroke="#00ffaa" stroke-width="5" fill="none" filter="url(#neonBlue)" opacity="0.8">
    <polyline points="220,40 180,40 180,100 220,100" />
    <polyline points="292,40 332,40 332,100 292,100" />
    <line x1="256" y1="60" x2="256" y2="80" />
    <line x1="246" y1="70" x2="266" y2="70" />
  </g>

  <g filter="url(#neonOrange)" stroke-linecap="round">
    <line x1="30" y1="200" x2="190" y2="90" stroke="#ff3300" stroke-width="18" />
    <line x1="30" y1="200" x2="190" y2="90" stroke="#ffaa00" stroke-width="8" />
    <line x1="30" y1="200" x2="190" y2="90" stroke="#ffffff" stroke-width="4" />
    
    <line x1="482" y1="200" x2="322" y2="90" stroke="#ff3300" stroke-width="18" />
    <line x1="482" y1="200" x2="322" y2="90" stroke="#ffaa00" stroke-width="8" />
    <line x1="482" y1="200" x2="322" y2="90" stroke="#ffffff" stroke-width="4" />
    
    <line x1="50" y1="440" x2="170" y2="280" stroke="#ff3300" stroke-width="18" />
    <line x1="50" y1="440" x2="170" y2="280" stroke="#ffaa00" stroke-width="8" />
    <line x1="50" y1="440" x2="170" y2="280" stroke="#ffffff" stroke-width="4" />
    
    <line x1="462" y1="440" x2="342" y2="280" stroke="#ff3300" stroke-width="18" />
    <line x1="462" y1="440" x2="342" y2="280" stroke="#ffaa00" stroke-width="8" />
    <line x1="462" y1="440" x2="342" y2="280" stroke="#ffffff" stroke-width="4" />
  </g>

  <g filter="url(#neonBlue)" stroke="#00f3ff" stroke-width="6" stroke-linejoin="round" fill="rgba(0, 20, 40, 0.75)">
    
    <polygon points="210,340 302,340 266,130 246,130" />
    <line x1="256" y1="130" x2="256" y2="340" />

    <polygon points="210,340 30,200 45,180 235,280" />
    <polygon points="302,340 482,200 467,180 277,280" />
    <polygon points="210,380 50,440 65,420 235,320" />
    <polygon points="302,380 462,440 447,420 277,320" />

    <polygon points="230,300 282,300 256,200" fill="rgba(0, 243, 255, 0.25)" />
    <line x1="256" y1="200" x2="256" y2="300" />
    <line x1="230" y1="300" x2="256" y2="250" />
    <line x1="282" y1="300" x2="256" y2="250" />

    <polygon points="190,320 322,320 322,400 190,400" fill="#030811" stroke-width="5"/>
    
    <circle cx="215" cy="345" r="18" />
    <circle cx="297" cy="345" r="18" />
    <circle cx="215" cy="385" r="18" />
    <circle cx="297" cy="385" r="18" />
    
    <circle cx="215" cy="345" r="8" fill="#ffffff" stroke="none" />
    <circle cx="297" cy="345" r="8" fill="#ffffff" stroke="none" />
    <circle cx="215" cy="385" r="8" fill="#ffffff" stroke="none" />
    <circle cx="297" cy="385" r="8" fill="#ffffff" stroke="none" />
  </g>
</svg>
